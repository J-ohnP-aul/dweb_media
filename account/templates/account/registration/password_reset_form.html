{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
  <h1>Reset Password</h1>
  <p>Enter your email address below, and we'll send you an email with instructions to reset your password.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Reset Password</button>
  </form>
{% endblock %}
